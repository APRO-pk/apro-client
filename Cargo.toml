[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.3.0"
edition = "2021"
repository = "https://github.com/APRO-pk/apro-client"

[workspace.dependencies]
apro-types = { path = "crates/apro-types", version = "0.3.0" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
dirs = "6"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
